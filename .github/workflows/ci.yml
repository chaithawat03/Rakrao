name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/firebase/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix infra/firebase
      - run: dotnet restore RakRao.sln
      - run: dotnet build RakRao.sln --no-restore
      - name: Backend and browser-rule acceptance on isolated emulators
        run: >-
          infra/firebase/node_modules/.bin/firebase emulators:exec
          --project demo-rakrao --only auth,firestore
          'dotnet test RakRao.sln --no-build --no-restore && npm --prefix infra/firebase run test:rules'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Cloud Run packaging without cloud credentials
        run: docker build -t rakrao-api:ci .
      - name: Verify non-root runtime and PORT binding
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rakrao-ci -p 127.0.0.1:8087:8087 -e PORT=8087 rakrao-api:ci
          trap 'docker logs rakrao-ci; docker rm -f rakrao-ci' EXIT
          [[ "$(docker exec rakrao-ci id -u)" != 0 ]]
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --retry-max-time 60 --max-time 10 http://127.0.0.1:8087/health
          [[ "$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/v1/me)" == 401 ]]
