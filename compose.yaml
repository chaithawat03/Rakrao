services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: rakrao
      POSTGRES_PASSWORD: rakrao_local_dev_only
      POSTGRES_DB: rakrao_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakrao -d rakrao_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
